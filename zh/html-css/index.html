<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="search-results-container" id="results-container">
    </div>

    <script>
        const searchResults = [
            { title: "Title 1", description: "This is the description ".repeat(7), image: "https://placehold.co/64x64/000000/FFFFFF/png" },
            { title: "Title 2", description: "This is the description ".repeat(7), image: "https://placehold.co/64x64/000000/FFFFFF/png" },
            { title: "Title 3", description: "This is the description ".repeat(7), image: "https://placehold.co/64x64/000000/FFFFFF/png" },
            { title: "Title 4", description: "This is the description ".repeat(7), image: "https://placehold.co/64x64/000000/FFFFFF/png" },
            { title: "Title 5", description: "This is the description ".repeat(7), image: "https://placehold.co/64x64/000000/FFFFFF/png" },
            { title: "Title 6", description: "This is the description ".repeat(7), image: "https://placehold.co/64x64/000000/FFFFFF/png" },
            { title: "Title 7", description: "This is the description ".repeat(7), image: "https://placehold.co/64x64/000000/FFFFFF/png" },
            { title: "Title 8", description: "This is the description ".repeat(7), image: "https://placehold.co/64x64/000000/FFFFFF/png" },
            { title: "Title 9", description: "This is the description ".repeat(7), image: "https://placehold.co/64x64/000000/FFFFFF/png" },
            { title: "Title 10", description: "This is the description ".repeat(7), image: "https://placehold.co/64x64/000000/FFFFFF/png" },
        ];

        const resultsContainer = document.getElementById("results-container");

        searchResults.forEach(result => {
            const item = document.createElement("div");
            item.classList.add("search-result-item");
            item.innerHTML = `
                <img src="${result.image}" alt="${result.title}">
                <div class="search-result-content">
                    <h2>${result.title}</h2>
                    <p>${result.description}</p>
                </div>
            `;
            resultsContainer.appendChild(item);
        });
    </script>
</body>
</html>
